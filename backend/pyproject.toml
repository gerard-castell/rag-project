[project]
name = "rag-project"
version = "0.1.0"
description = "FastAPI backend for PDF ingestion, hybrid vector search, and LLM-backed chat"
readme = "../README.md"
requires-python = ">=3.12"
license = "MIT"
authors = [{ name = "Gerard Castell" }]
urls = { repository = "https://github.com/gerard-castell/rag-project" }
dependencies = [
    "docker>=7.1.0",
    "fastapi>=0.128.1",
    "fastembed>=0.7.4",
    "httpx>=0.28.1",
    "langchain-text-splitters>=1.1.0",
    "llama-parse>=0.6.91",
    "onnxruntime-gpu>=1.24.1",
    "openai>=2.16.0",
    "pydantic-settings>=2.12.0",
    "python-dotenv>=1.2.1",
    "python-multipart>=0.0.22",
    "qdrant-client>=1.16.2",
    "sentence-transformers>=5.2.2",
    "torch>=2.10.0",
    "uvicorn>=0.40.0",
]

[tool.uv]
# fastembed depends on plain "onnxruntime" (CPU-only), which installs into the
# same onnxruntime/ import namespace as onnxruntime-gpu and can shadow its CUDA
# execution provider depending on install order. Drop it since onnxruntime-gpu
# already satisfies every `import onnxruntime` call.
override-dependencies = ["onnxruntime; sys_platform == 'never'"]

[tool.ruff]
line-length = 88
target-version = "py312"
fix = true
extend-exclude = [".agents"]
lint.extend-select = ["I", "B", "UP", "SIM", "RUF", "D", "TID", "N", "E", "F"]

lint.ignore = ["E203", "D100", "D104", "D107", "D203", "D213", "TID252"]
lint.per-file-ignores = { "__init__.py" = ["F401"] }

[tool.ruff.lint.pydocstyle]
convention = "pep257"


[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = true

[tool.ruff.lint.isort]
split-on-trailing-comma = false


[tool.mypy]
python_version = "3.12"
explicit_package_bases = true
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true
follow_imports = "skip"
show_error_codes = true
strict_optional = false

warn_unused_ignores = false
warn_redundant_casts = true
warn_unreachable = true

disallow_any_expr = false
disallow_any_decorated = false
disallow_any_generics = true
disallow_any_unimported = false
disallow_any_explicit = true

no_implicit_optional = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
disallow_untyped_calls = false
disallow_untyped_decorators = false

strict_equality = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["."]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "mypy>=2.3.1",
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
    "respx>=0.23.1",
    "ruff>=0.16.5",
]
