name: PR title

on:
  pull_request:
    types: [opened, edited, synchronize, reopened]

jobs:
  lint-title:
    name: Conventional Commits check
    runs-on: ubuntu-latest
    steps:
      - uses: amannn/action-semantic-pull-request@v6
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          types: |
            feat
            fix
            docs
            chore
            refactor
            perf
            test
            ci
            build
          requireScope: false
          subjectPattern: ^[a-z].+[^.]$
          subjectPatternError: |
            The PR title subject must start lowercase and not end with a period.
