name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  changes:
    name: Detect changed scope
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      frontend: ${{ steps.filter.outputs.frontend }}
    steps:
      - uses: actions/checkout@v7
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            backend:
              - 'backend/**'
              - '.github/workflows/ci.yml'
            frontend:
              - 'frontend/**'
              - '.github/workflows/ci.yml'

  backend:
    name: Backend (lint, type-check, test)
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    env:
      LLAMA_PARSE_API_KEY: dummy-ci-key
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: backend/uv.lock

      # Runners have no GPU: uv.lock pins CUDA torch/onnxruntime-gpu wheels
      # plus ~2.5GB of bundled nvidia-*-cu12/triton libs that CPU CI never
      # uses. Skip those from the locked sync and install CPU-only builds
      # instead (~190MB). Local/prod GPU installs are untouched since this
      # only changes this job's venv, not pyproject.toml/uv.lock.
      - name: Install dependencies
        run: |
          uv sync --all-groups \
            --no-install-package torch --no-install-package onnxruntime-gpu \
            --no-install-package triton --no-install-package cuda-bindings \
            --no-install-package nvidia-cublas-cu12 --no-install-package nvidia-cuda-cupti-cu12 \
            --no-install-package nvidia-cuda-nvrtc-cu12 --no-install-package nvidia-cuda-runtime-cu12 \
            --no-install-package nvidia-cudnn-cu12 --no-install-package nvidia-cufft-cu12 \
            --no-install-package nvidia-cufile-cu12 --no-install-package nvidia-curand-cu12 \
            --no-install-package nvidia-cusolver-cu12 --no-install-package nvidia-cusparse-cu12 \
            --no-install-package nvidia-cusparselt-cu12 --no-install-package nvidia-nccl-cu12 \
            --no-install-package nvidia-nvjitlink-cu12 --no-install-package nvidia-nvshmem-cu12 \
            --no-install-package nvidia-nvtx-cu12
          uv pip install "torch>=2.10.0" --index-url https://download.pytorch.org/whl/cpu
          # --no-config: pyproject.toml's override-dependencies drops plain
          # "onnxruntime" everywhere (it would shadow onnxruntime-gpu's CUDA
          # provider), which also blocks this direct install unless project
          # config discovery is skipped for this command.
          uv pip install onnxruntime --no-config

      - name: Ruff check
        run: uv run --no-sync ruff check .

      - name: Ruff format check
        run: uv run --no-sync ruff format --check .

      - name: Mypy
        run: uv run --no-sync mypy src/

      - name: Pytest
        run: uv run --no-sync pytest

  frontend:
    name: Frontend (type-check, lint)
    needs: changes
    if: needs.changes.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npx tsc --noEmit

      - name: Lint
        run: npm run lint
