name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend:
    name: Backend (lint, type-check, test)
    runs-on: ubuntu-latest
    env:
      LLAMA_PARSE_API_KEY: dummy-ci-key
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      # Runners have no GPU: uv.lock pins CUDA torch/onnxruntime-gpu wheels
      # plus ~2.5GB of bundled nvidia-*-cu12/triton libs that CPU CI never
      # uses. Skip those from the locked sync and install CPU-only builds
      # instead (~190MB). Local/prod GPU installs are untouched since this
      # only changes this job's venv, not pyproject.toml/uv.lock.
      - name: Install dependencies
        run: |
          uv sync --all-groups \
            --no-install-package torch --no-install-package onnxruntime-gpu \
            --no-install-package triton --no-install-package cuda-bindings \
            --no-install-package nvidia-cublas-cu12 --no-install-package nvidia-cuda-cupti-cu12 \
            --no-install-package nvidia-cuda-nvrtc-cu12 --no-install-package nvidia-cuda-runtime-cu12 \
            --no-install-package nvidia-cudnn-cu12 --no-install-package nvidia-cufft-cu12 \
            --no-install-package nvidia-cufile-cu12 --no-install-package nvidia-curand-cu12 \
            --no-install-package nvidia-cusolver-cu12 --no-install-package nvidia-cusparse-cu12 \
            --no-install-package nvidia-cusparselt-cu12 --no-install-package nvidia-nccl-cu12 \
            --no-install-package nvidia-nvjitlink-cu12 --no-install-package nvidia-nvshmem-cu12 \
            --no-install-package nvidia-nvtx-cu12
          uv pip install "torch>=2.10.0" --index-url https://download.pytorch.org/whl/cpu
          uv pip install onnxruntime

      - name: Ruff check
        run: uv run --no-sync ruff check .

      - name: Ruff format check
        run: uv run --no-sync ruff format --check .

      - name: Mypy
        run: uv run --no-sync mypy src/

      - name: Pytest
        run: uv run --no-sync pytest

  frontend:
    name: Frontend (type-check, lint)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npx tsc --noEmit

      - name: Lint
        run: npm run lint
