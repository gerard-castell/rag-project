services:
  qdrant:
    image: qdrant/qdrant:latest
    container_name: qdrant_service
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - ./qdrant_storage:/qdrant/storage:z
    restart: unless-stopped
    environment:
      - QDRANT__SERVICE__ENABLE_STATIC_CONTENT=1
    deploy:
      resources:
        limits:
          memory: 1g
    # qdrant's image ships no curl/wget; /dev/tcp is bash's built-in socket redirect.
    healthcheck:
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/6333 && printf 'GET /readyz HTTP/1.1\\r\\nHost: localhost\\r\\nConnection: close\\r\\n\\r\\n' >&3 && head -n1 <&3 | grep -q '200 OK'"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s

  llama-cpp:
    image: ghcr.io/ggml-org/llama.cpp:full-cuda
    container_name: llama-cpp-gpu
    ports:
      - "8080:8080"
    volumes:
      - ./models:/models
    # -m: model path  -ngl 99: offload all layers to GPU  --ctx-size: context window
    command: ["--server", "-m", "/models/gemma-4-E4B-it-Q4_K_M.gguf", "--host", "0.0.0.0", "--port", "8080", "-ngl", "99", "--ctx-size", "4096"]
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    restart: unless-stopped

  # Scopes the api container's Docker access to exactly what VRAMScheduler needs
  # (inspect/start/stop the llama-cpp-gpu container) instead of mounting the raw
  # daemon socket into api, which would otherwise be root-equivalent host access.
  # See "Security notes" in README.md.
  docker-socket-proxy:
    image: tecnativa/docker-socket-proxy:latest
    container_name: docker-socket-proxy
    environment:
      - CONTAINERS=1 # GET /containers/* (inspect, status)
      - POST=1 # gate for POST requests; scoped further by ALLOW_*
      - ALLOW_START=1
      - ALLOW_STOP=1
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    restart: unless-stopped

  api:
    build: ./backend
    container_name: rag-api
    ports:
      - "8000:8000"
    env_file: ./backend/.env
    environment:
      - QDRANT_URL=http://qdrant:6333
      - LLAMA_CPP_URL=http://llama-cpp:8080
      - DOCKER_HOST=tcp://docker-socket-proxy:2375
    volumes:
      - ./models_cache:/app/models_cache
      - ./temp_uploads:/app/temp_uploads
    depends_on:
      qdrant:
        condition: service_healthy
      llama-cpp:
        condition: service_started
      docker-socket-proxy:
        condition: service_started
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    restart: unless-stopped
    # python:3.12-slim has no curl; the venv's own interpreter can hit /health.
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request as u; u.urlopen('http://localhost:8000/health', timeout=3)"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 15s

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
      args:
        - BACKEND_URL=http://api:8000
    container_name: rag-frontend
    ports:
      - "3000:3000"
    environment:
      - BACKEND_URL=http://api:8000
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

  # Dev variant: `next dev` with hot reload, source bind-mounted from ./frontend.
  # Runs standalone (no depends_on) so it can be started without the backend stack.
  frontend-dev:
    build:
      context: .
      dockerfile: Dockerfile.frontend.dev
    container_name: rag-frontend-dev
    ports:
      - "3000:3000"
    environment:
      - BACKEND_URL=http://api:8000
      - WATCHPACK_POLLING=true
    volumes:
      - ./frontend:/app
      - /app/node_modules
      - /app/.next
