services:
  qdrant:
    image: qdrant/qdrant:latest
    container_name: qdrant_service
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - ./qdrant_storage:/qdrant/storage:z
    restart: unless-stopped
    environment:
      - QDRANT__SERVICE__ENABLE_STATIC_CONTENT=1
    deploy:
      resources:
        limits:
          memory: 1g

  llama-cpp:
    image: ghcr.io/ggml-org/llama.cpp:full-cuda
    container_name: llama-cpp-gpu
    ports:
      - "8080:8080"
    volumes:
      - ./models:/models
    # -m: model path  -ngl 99: offload all layers to GPU  --ctx-size: context window
    command: ["--server", "-m", "/models/gemma-4-E4B-it-Q4_K_M.gguf", "--host", "0.0.0.0", "--port", "8080", "-ngl", "99", "--ctx-size", "4096"]
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    restart: unless-stopped

  api:
    build: ./backend
    container_name: rag-api
    ports:
      - "8000:8000"
    env_file: ./backend/.env
    environment:
      - QDRANT_URL=http://qdrant:6333
      - LLAMA_CPP_URL=http://llama-cpp:8080
    volumes:
      - ./models_cache:/app/models_cache
      - ./temp_uploads:/app/temp_uploads
      - /var/run/docker.sock:/var/run/docker.sock
    depends_on:
      - qdrant
      - llama-cpp
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    restart: unless-stopped

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
      args:
        - BACKEND_URL=http://api:8000
    container_name: rag-frontend
    ports:
      - "3000:3000"
    environment:
      - BACKEND_URL=http://api:8000
    depends_on:
      - api
    restart: unless-stopped

  # Dev variant: `next dev` with hot reload, source bind-mounted from ./frontend.
  # Runs standalone (no depends_on) so it can be started without the backend stack.
  frontend-dev:
    build:
      context: .
      dockerfile: Dockerfile.frontend.dev
    container_name: rag-frontend-dev
    ports:
      - "3000:3000"
    environment:
      - BACKEND_URL=http://api:8000
      - WATCHPACK_POLLING=true
    volumes:
      - ./frontend:/app
      - /app/node_modules
      - /app/.next
